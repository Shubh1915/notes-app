<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

  <title>Notes App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Notes App</h1>

    <button class="toggle-btn" onclick="toggleDarkMode()">Dark Mode</button>

    <textarea id="noteInput" placeholder="Write your note here..."></textarea>
    <div id="errorMsg" class="error">Note cannot be empty!</div>

    <button class="add-btn" onclick="addNote()">Add Note</button>

    <div id="notesList"></div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes')) || [];

    function saveNotes() {
      localStorage.setItem('notes', JSON.stringify(notes));
    }

    function displayNotes() {
      const notesList = document.getElementById('notesList');
      notesList.innerHTML = '';

      notes.forEach((note, index) => {
        const div = document.createElement('div');
        div.className = 'note';
        div.textContent = note;

        const actions = document.createElement('div');
        actions.className = 'note-actions';

        const edit = document.createElement('button');
        edit.className = 'edit-btn';
        edit.textContent = 'Edit';
        edit.onclick = () => editNote(index);

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = 'Delete';
        del.onclick = () => deleteNote(index);

        actions.append(edit, del);
        div.appendChild(actions);
        notesList.appendChild(div);
      });
    }

    function addNote() {
      const input = document.getElementById('noteInput');
      const error = document.getElementById('errorMsg');
      const text = input.value.trim();

      if (!text) {
        error.style.display = 'block';
        return;
      }

      error.style.display = 'none';
      notes.push(text);
      saveNotes();
      displayNotes();
      input.value = '';
    }

    function deleteNote(i) {
      notes.splice(i, 1);
      saveNotes();
      displayNotes();
    }

    function editNote(i) {
      const updated = prompt('Edit note:', notes[i]);
      if (updated && updated.trim()) {
        notes[i] = updated.trim();
        saveNotes();
        displayNotes();
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    displayNotes();
  </script>

</body>
</html>
